<script>
  (() => {
    const root = document.getElementById("tide-designs");
    const config = { meters: true };
    const levels = [
      60, 54, 41, 79, 32, 36, 23, 27, 46, 39, 71, 24, 17, 0, 0, 0,
    ];
    const saved = window.openai?.widgetState?.privateContent || {};
    const restorers = [];
    root.querySelectorAll(".td-phone").forEach((phone) => {
      const index = { Everyday: 0, "Thumb zone": 1, Studio: 2 }[
        phone.dataset.design
      ];
      const name = phone.dataset.design;
      const state = {
        volume: -36,
        muted: false,
        source: "HDMI 1",
        upmix: "Dolby",
        dirac: true,
        preset: "0",
        ...saved[name],
      };
      const label =
        index === 1 ? "Listening room" : index === 2 ? "TIDE / 16" : "Tide";
      phone.innerHTML = `
 <div class="td-status"><span>9:41</span><span class="td-island" aria-hidden="true"></span><span class="td-status-right"><i data-lucide="signal" aria-hidden="true"></i><i data-lucide="wifi" aria-hidden="true"></i><i data-lucide="battery-full" aria-hidden="true"></i></span></div>
 <header class="td-heading"><div><div class="td-kicker">${index === 2 ? "Listening console" : "Tide16"}</div><h2>${label}</h2><div class="td-connection"><span class="td-dot"></span>Connected</div></div><span class="td-logo"><i data-lucide="audio-lines" aria-hidden="true"></i></span></header>
 <div class="td-modes"><button class="td-mode cursor-interaction" data-mode="music" aria-pressed="false"><span class="td-mode-icon"><i data-lucide="music-2" aria-hidden="true"></i><i class="td-check" data-lucide="check" aria-hidden="true"></i></span><strong>Music</strong><small>Optical · Native</small></button><button class="td-mode cursor-interaction" data-mode="cinema" aria-pressed="true"><span class="td-mode-icon"><i data-lucide="clapperboard" aria-hidden="true"></i><i class="td-check" data-lucide="check" aria-hidden="true"></i></span><strong>Cinema</strong><small>HDMI · Dolby</small></button></div>
 <section class="td-volume" aria-label="Volume controls"><div class="td-volume-top"><span>Master volume</span><i data-lucide="volume-2" aria-hidden="true"></i></div><div class="td-value" aria-live="polite"><b data-value>−36.0</b><span>dB</span></div><input class="td-slider" aria-label="Master volume in decibels" type="range" min="-80" max="0" step="0.5" value="-36"><div class="td-volume-bottom"><button class="td-nudge cursor-interaction" data-step="-0.5" aria-label="Decrease volume by half a decibel">−</button><button class="td-mute cursor-interaction" aria-pressed="false"><i data-lucide="volume-x" aria-hidden="true"></i><span>Mute</span></button><button class="td-nudge cursor-interaction" data-step="0.5" aria-label="Increase volume by half a decibel">+</button></div></section>
 <section class="td-controls" aria-label="Audio settings"><div class="td-row"><span class="td-row-label"><i data-lucide="cable" aria-hidden="true"></i>Input</span><select data-source aria-label="Input"><option>Optical 1</option><option>Optical 2</option><option>HDMI 1</option><option>HDMI 2</option><option>HDMI 3</option><option>eARC</option><option>USB</option><option>Bluetooth</option><option>Coaxial 1</option><option>Coaxial 2</option><option>Analog RCA</option><option>Analog XLR</option></select></div><div class="td-row"><span class="td-row-label">Upmix</span><div class="td-segments" aria-label="Upmix mode">${["Native", "Dolby", "DTS"].map((v) => `<button class="cursor-interaction" data-upmix="${v}" aria-pressed="${v === "Dolby"}">${v}</button>`).join("")}</div></div><div class="td-row"><span class="td-row-label"><i data-lucide="sparkles" aria-hidden="true"></i>Dirac Live</span><label class="td-switch cursor-interaction"><input data-dirac type="checkbox" checked aria-label="Enable Dirac Live"><span></span></label></div><div class="td-row"><span class="td-row-label">Preset</span><select data-preset aria-label="Dirac preset"><option value="0">+8 dB / −1 dB</option><option value="1">Preset 2</option><option value="2">Preset 3</option><option value="3">Preset 4</option><option value="4">Preset 5</option><option value="5">Preset 6</option><option value="6">Preset 7</option><option value="7">Preset 8</option><option value="8">Preset 9</option></select></div></section>
 <section class="td-meters" aria-label="Simulated 16-channel output meter"><div class="td-meter-head"><span>Output levels</span><span>16 channels</span></div><div class="td-meter-bars">${levels.map((v) => `<div class="td-meter-track"><div class="td-meter-fill" style="--level:${v}%"></div></div>`).join("")}</div><div class="td-meter-ids">${levels.map((v, i) => `<span>${i + 1}</span>`).join("")}</div></section><div class="td-home" aria-hidden="true"></div>`;
      const slider = phone.querySelector(".td-slider");
      function render() {
        phone.querySelector("[data-value]").textContent = state.muted
          ? "Muted"
          : state.volume.toFixed(1).replace("-", "−");
        phone.querySelector(".td-value span").hidden = state.muted;
        if (state.muted)
          phone.querySelector("[data-value]").style.fontSize = "44px";
        else phone.querySelector("[data-value]").style.fontSize = "";
        slider.value = state.volume;
        phone
          .querySelector(".td-mute")
          .setAttribute("aria-pressed", state.muted);
        phone.querySelector(".td-mute span").textContent = state.muted
          ? "Unmute"
          : "Mute";
        phone.querySelector("[data-source]").value = state.source;
        phone.querySelector("[data-preset]").value = state.preset;
        phone.querySelector("[data-dirac]").checked = state.dirac;
        phone
          .querySelectorAll("[data-upmix]")
          .forEach((b) =>
            b.setAttribute("aria-pressed", b.dataset.upmix === state.upmix),
          );
        phone
          .querySelectorAll("[data-mode]")
          .forEach((b) =>
            b.setAttribute(
              "aria-pressed",
              b.dataset.mode === "music"
                ? state.source === "Optical 1" && state.upmix === "Native"
                : state.source === "HDMI 1" && state.upmix === "Dolby",
            ),
          );
        phone
          .querySelectorAll(".td-meter-fill")
          .forEach(
            (bar, i) =>
              (bar.style.height = state.muted ? "0%" : levels[i] + "%"),
          );
      }
      function persist() {
        saved[name] = { ...state };
        window.openai
          ?.setWidgetState?.({
            modelContent: {
              design: name,
              volume: state.volume,
              input: state.source,
              upmix: state.upmix,
              meters: config.meters,
            },
            privateContent: saved,
          })
          ?.catch(() => {});
      }
      slider.addEventListener("input", () => {
        state.volume = Number(slider.value);
        render();
        persist();
      });
      phone.querySelectorAll("[data-step]").forEach((b) =>
        b.addEventListener("click", () => {
          state.volume = Math.max(
            -80,
            Math.min(0, state.volume + Number(b.dataset.step)),
          );
          render();
          persist();
        }),
      );
      phone.querySelector(".td-mute").addEventListener("click", () => {
        state.muted = !state.muted;
        render();
        persist();
      });
      phone.querySelectorAll("[data-mode]").forEach((b) =>
        b.addEventListener("click", () => {
          state.source = b.dataset.mode === "music" ? "Optical 1" : "HDMI 1";
          state.upmix = b.dataset.mode === "music" ? "Native" : "Dolby";
          render();
          persist();
        }),
      );
      phone.querySelectorAll("[data-upmix]").forEach((b) =>
        b.addEventListener("click", () => {
          state.upmix = b.dataset.upmix;
          render();
          persist();
        }),
      );
      phone.querySelector("[data-source]").addEventListener("change", (e) => {
        state.source = e.target.value;
        render();
        persist();
      });
      phone.querySelector("[data-preset]").addEventListener("change", (e) => {
        state.preset = e.target.value;
        render();
        persist();
      });
      phone.querySelector("[data-dirac]").addEventListener("change", (e) => {
        state.dirac = e.target.checked;
        render();
        persist();
      });
      render();
      restorers.push((next) => {
        if (next[name]) {
          Object.assign(state, next[name]);
          render();
        }
      });
    });
    function designRender() {
      root
        .querySelectorAll(".td-meters")
        .forEach((m) => (m.hidden = !config.meters));
    }
    designRender();
    if (globalThis.Tweak) {
      const tweak = new Tweak({ container: root, onChange: designRender });
      tweak.addToggle(config, "meters", { label: "Show channel meters" });
    }
    window.addEventListener("openai:set_globals", (event) => {
      const next = event.detail?.globals?.widgetState?.privateContent;
      if (next) restorers.forEach((restore) => restore(next));
    });
  })();
</script>
