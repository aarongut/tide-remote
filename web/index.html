<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#f2f2f7"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#101114"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="A personal remote for your miniDSP Tide16."
    />
    <title>Tide 16</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="remote">
      <header class="heading">
        <div>
          <h1>Tide 16</h1>
          <div id="connection" class="connection" role="status">
            <span class="dot"></span
            ><span id="connection-text">Connecting…</span>
          </div>
        </div>
        <span class="brand" aria-hidden="true"
          ><i data-lucide="audio-lines"></i
        ></span>
      </header>
      <section class="meters" aria-label="Output channel levels">
        <div class="meter-heading">
          <h2>Output levels</h2>
          <span id="format" class="format" aria-label="Input format"
            >No signal</span
          >
        </div>
        <div id="meter-grid" class="meter-grid">
          <p class="meter-empty">Waiting for your processor</p>
        </div>
      </section>
      <section class="settings" aria-label="Audio controls">
        <div class="setting-row">
          <label for="source">Input</label
          ><select id="source" disabled>
            <option>—</option>
          </select>
        </div>
        <div class="setting-row">
          <span id="upmix-label">Upmix</span>
          <div class="segments" role="group" aria-labelledby="upmix-label">
            <button data-upmix="native" aria-pressed="false" disabled>
              Native</button
            ><button data-upmix="datmos" aria-pressed="false" disabled>
              Dolby</button
            ><button data-upmix="dts" aria-pressed="false" disabled>DTS</button>
          </div>
        </div>
        <div class="setting-row">
          <label for="dirac">Dirac Live</label
          ><label class="switch"
            ><input
              type="checkbox"
              id="dirac"
              aria-label="Enable Dirac Live"
              disabled /><span></span
          ></label>
        </div>
        <div class="setting-row">
          <label for="preset">Preset</label
          ><select id="preset" disabled>
            <option>—</option>
          </select>
        </div>
      </section>
      <section class="volume" aria-label="Master volume controls">
        <div class="volume-heading">
          <label for="volume-slider">Master volume</label
          ><i data-lucide="volume-2" aria-hidden="true"></i>
        </div>
        <div class="volume-value">
          <output id="volume-value" for="volume-slider">—</output
          ><span id="volume-unit">dB</span>
        </div>
        <input
          type="range"
          id="volume-slider"
          min="-80"
          max="0"
          step="0.5"
          value="-80"
          aria-label="Master volume in decibels"
          disabled
        />
        <div class="volume-buttons">
          <button
            id="decrease"
            class="nudge"
            aria-label="Decrease volume by half a decibel"
            disabled
          >
            −</button
          ><button id="mute" class="mute" aria-pressed="false" disabled>
            <i data-lucide="volume-x" aria-hidden="true"></i
            ><span id="mute-label">Mute</span></button
          ><button
            id="increase"
            class="nudge"
            aria-label="Increase volume by half a decibel"
            disabled
          >
            +
          </button>
        </div>
      </section>
      <div id="message" class="message" role="status" aria-live="polite"></div>
    </main>
  </body>
</html>
